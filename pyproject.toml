[project]
name = "lucknow-water-bowl-backend"
version = "0.1.0"
description = "Backend for water bowl distribution drive for animals in Lucknow"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.15.0",
    "python-multipart>=0.0.20",
    "httpx>=0.28.0",
    "python-dotenv>=1.1.0",
    "pydantic-settings>=2.9.0",
    "aiofiles>=24.1.0",
    "azure-storage-blob>=12.24.0",
    "azure-identity>=1.19.0",
    "azure-keyvault-secrets>=4.9.0",
    "pyjwt[crypto]>=2.9.0",
    "bcrypt>=4.1.0",
    "email-validator>=2.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
